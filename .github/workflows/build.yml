name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "keystore=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Signing the release APK with the key from repository secrets."
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret found - the release APK will be signed with the debug key (still installable)."
          fi

      - name: Build release APK
        env:
          CELLSHIELD_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          CELLSHIELD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CELLSHIELD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CELLSHIELD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          src="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          echo "Built APK: $src"
          cp "$src" dist/UnefCheckup.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnefCheckup-apk
          path: dist/UnefCheckup.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UnefCheckup.apk
