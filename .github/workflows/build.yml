name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      # Persist the built-in fallback signing key between builds so that an APK
      # built today and an update built months later carry the SAME signature
      # and install over each other. Unused once real signing secrets are set
      # (see README -> Signing). Delete this cache only if you accept that the
      # next update will need a one-time uninstall + reinstall.
      - name: Cache fallback signing key
        uses: actions/cache@v4
        with:
          path: ~/.unef/fallback.keystore
          key: unef-fallback-keystore-v1

      - name: Resolve signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            {
              echo "CELLSHIELD_KEYSTORE=$KS"
              echo "CELLSHIELD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "CELLSHIELD_KEY_ALIAS=$KEY_ALIAS"
              echo "CELLSHIELD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets."
          else
            KS="$HOME/.unef/fallback.keystore"
            mkdir -p "$HOME/.unef"
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
                -alias unef -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass uneffamily -keypass uneffamily \
                -dname "CN=Unef Checkup, O=Unef Checkup, C=US"
              echo "::notice::Created a new fallback signing key (cached as unef-fallback-keystore-v1)."
            else
              echo "Reusing the cached fallback signing key."
            fi
            {
              echo "CELLSHIELD_KEYSTORE=$KS"
              echo "CELLSHIELD_KEYSTORE_PASSWORD=uneffamily"
              echo "CELLSHIELD_KEY_ALIAS=unef"
              echo "CELLSHIELD_KEY_PASSWORD=uneffamily"
            } >> "$GITHUB_ENV"
            echo "::warning::No signing secrets set - using the built-in fallback key. Fine for family sideloading; see README to switch to your own key."
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          src="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          echo "Built APK: $src"
          cp "$src" dist/UnefCheckup.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnefCheckup-apk
          path: dist/UnefCheckup.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          files: dist/UnefCheckup.apk
          make_latest: true
          body: |
            Automated build of Unef Checkup.

            Direct download for family:
            https://github.com/RetroDevops/unef-checkup/releases/latest/download/UnefCheckup.apk

            Install steps: see INSTALL-FOR-PARENTS.md in the repo.
