name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      # Keep the fallback debug signing key stable across builds, so an APK
      # built today and an update built later use the SAME signature and
      # install over each other cleanly. Ignored once real signing secrets
      # are configured (see README -> Signing).
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: unef-debug-keystore-v1

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "keystore=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Signing the release APK with the key from repository secrets."
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret set. Building with the (cached) Android debug key. Fine for family sideloading; set up real signing secrets before wider distribution - see README."
          fi

      - name: Build release APK
        env:
          CELLSHIELD_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          CELLSHIELD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CELLSHIELD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CELLSHIELD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          src="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          echo "Built APK: $src"
          cp "$src" dist/UnefCheckup.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnefCheckup-apk
          path: dist/UnefCheckup.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          files: dist/UnefCheckup.apk
          make_latest: true
          body: |
            Automated build of Unef Checkup.

            Direct download for family:
            https://github.com/RetroDevops/unef-checkup/releases/latest/download/UnefCheckup.apk

            Install steps: see INSTALL-FOR-PARENTS.md in the repo.
