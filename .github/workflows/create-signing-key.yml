name: Create signing key

# One-time helper. Run this after you have set the KEYSTORE_PASSWORD and
# KEY_ALIAS repository secrets (see README.md -> "Signing"). It creates a
# release keystore and uploads it as a build artifact for you to download.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Set the KEYSTORE_PASSWORD and KEY_ALIAS repository secrets first (see README.md)."
            exit 1
          fi

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Cell Shield Lite, OU=Family, O=Cell Shield Lite, L=Home, ST=NA, C=US"
          base64 -w0 release.keystore > release.keystore.base64
          echo "Created release.keystore"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: |
            release.keystore
            release.keystore.base64
          retention-days: 1
